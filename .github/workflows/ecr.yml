name: Build and Push to AWS ECR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.25.3)'
        required: true

permissions:
  id-token: write
  contents: read

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'docmost' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create empty EE placeholder (skip private submodule)
        run: rm -rf apps/server/src/ee && mkdir -p apps/server/src/ee

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata for tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ !contains(env.VERSION, '-') }}
            type=raw,value=latest,enable=${{ !contains(env.VERSION, '-') }}

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max
          build-args: |
            OEM=${{ vars.OEM || false }}
            OEM_HIDE_API_KEYS=${{ vars.OEM_HIDE_API_KEYS || false }}
            OEM_HIDE_SECURITY_SSO=${{ vars.OEM_HIDE_SECURITY_SSO || false }}
            OEM_HIDE_API_MANAGEMENT=${{ vars.OEM_HIDE_API_MANAGEMENT || false }}
            OEM_HIDE_AUDIT_LOG=${{ vars.OEM_HIDE_AUDIT_LOG || false }}
            OEM_HIDE_AI_SETTINGS=${{ vars.OEM_HIDE_AI_SETTINGS || false }}
            OEM_HIDE_VERSION_UPDATE=${{ vars.OEM_HIDE_VERSION_UPDATE || false }}
            OEM_HIDE_LICENSE=${{ vars.OEM_HIDE_LICENSE || false }}
            OEM_HIDE_VERIFIED_PAGES=${{ vars.OEM_HIDE_VERIFIED_PAGES || false }}
            OEM_APP_NAME=${{ vars.OEM_APP_NAME || 'Docmost' }}
